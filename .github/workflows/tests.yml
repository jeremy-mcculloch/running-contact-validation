name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest tests/unit -v

  fe-tests:
    name: FEniCSx tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FE container
        run: docker compose build fe

      - name: Report FE versions
        run: docker compose run --rm -T fe python3 scripts/report_fe_versions.py

      - name: Run FE benchmarks
        run: |
          docker compose run --rm -T fe \
            python3 -m pytest tests/benchmarks -v -rs
